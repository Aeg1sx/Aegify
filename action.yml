name: "Aegify"
description: "White-box SAST for pull requests with optional LLM verification"
author: "Aegify maintainers"

branding:
  icon: "shield"
  color: "blue"

inputs:
  llm-api-key:
    description: "Anthropic API key for LLM verification"
    required: false
  llm-enabled:
    description: "Enable LLM verification. Keep disabled for untrusted pull requests."
    required: false
    default: "false"
  llm-base-url:
    description: "Custom base URL for Anthropic API (for API gateways)"
    required: false
  severity:
    description: "Minimum severity to report: critical, high, medium, low"
    required: false
    default: "low"
  model:
    description: "LLM model to use for verification"
    required: false
    default: "claude-opus-4-6"
  max-related-files:
    description: "Maximum number of related files to include in scan"
    required: false
    default: "150"
  upload-sarif:
    description: "Upload SARIF results to GitHub Code Scanning"
    required: false
    default: "false"
  post-comment:
    description: "Post/update a PR comment with results"
    required: false
    default: "false"

outputs:
  findings-count:
    description: "Total number of confirmed findings"
    value: ${{ steps.scan.outputs.findings-count }}
  sarif-file:
    description: "Path to the SARIF results file"
    value: "aegify-results.sarif"
  comment-file:
    description: "Path to the PR comment markdown file"
    value: "aegify-pr-comment.md"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install Aegify
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-input "$ACTION_PATH/scanner"

    - name: Fetch base branch for diff
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: git fetch --no-tags --depth=1 origin "$BASE_REF"

    - name: Run PR scan
      id: scan
      shell: bash
      env:
        AEGIFY_ANTHROPIC_API_KEY: ${{ inputs.llm-api-key }}
        AEGIFY_LLM__BASE_URL: ${{ inputs.llm-base-url }}
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_LLM_ENABLED: ${{ inputs.llm-enabled }}
        INPUT_MAX_RELATED: ${{ inputs.max-related-files }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_SEVERITY: ${{ inputs.severity }}
      run: |
        case "$INPUT_SEVERITY" in critical|high|medium|low) ;; *) exit 2 ;; esac
        case "$INPUT_MAX_RELATED" in ''|*[!0-9]*) exit 2 ;; esac
        if [ "$INPUT_LLM_ENABLED" = "true" ]; then
          test -n "$AEGIFY_ANTHROPIC_API_KEY"
          llm_flag="--llm"
        elif [ "$INPUT_LLM_ENABLED" = "false" ]; then
          llm_flag="--no-llm"
        else
          exit 2
        fi

        aegify scan-pr . \
          --severity "$INPUT_SEVERITY" \
          --model "$INPUT_MODEL" \
          --max-related "$INPUT_MAX_RELATED" \
          "$llm_flag" \
          --output-file aegify-results.sarif \
          --comment-file aegify-pr-comment.md \
          -v
        findings_count="$(python3 -c 'import json; print(len(json.load(open("aegify-results.sarif", encoding="utf-8")).get("runs", [{}])[0].get("results", [])))')"
        echo "findings-count=$findings_count" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true' && always()
      uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      with:
        sarif_file: aegify-results.sarif

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request' && always()
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const commentPath = 'aegify-pr-comment.md';

          if (!fs.existsSync(commentPath)) {
            console.log('No comment file found, skipping');
            return;
          }

          const body = fs.readFileSync(commentPath, 'utf8');
          const marker = '<!-- aegify-pr-comment -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          // Find existing comment to update
          const comments = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.data.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
            console.log(`Updated existing comment ${existing.id}`);
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
            console.log('Created new comment');
          }
