services:
  scanner:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./target:/scan/target
      - ./rules:/scan/rules
    environment:
      - AEGIFY_ANTHROPIC_API_KEY=${AEGIFY_ANTHROPIC_API_KEY:-}
      - AEGIFY_RULES__CUSTOM_RULES=/scan/rules

  dashboard:
    build: ./dashboard
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/dev.db}
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in a local .env or inject it from Vault}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET in a local .env or inject it from Vault}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:?Set exact workspace administrator emails}
      AUTH_ALLOWED_DOMAINS: ${AUTH_ALLOWED_DOMAINS:-}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-false}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-false}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_OKTA_ID: ${AUTH_OKTA_ID:-}
      AUTH_OKTA_SECRET: ${AUTH_OKTA_SECRET:-}
      AUTH_OKTA_ISSUER: ${AUTH_OKTA_ISSUER:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GITLAB_ID: ${AUTH_GITLAB_ID:-}
      AUTH_GITLAB_SECRET: ${AUTH_GITLAB_SECRET:-}
      AEGIFY_UPLOAD_TOKEN: ${AEGIFY_UPLOAD_TOKEN:-}
      AEGIFY_UPLOAD_PROJECT_ID: ${AEGIFY_UPLOAD_PROJECT_ID:-}
    volumes:
      - dashboard-data:/data
    tmpfs:
      - /tmp
      - /app/.next/cache

volumes:
  dashboard-data:
