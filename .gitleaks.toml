title = "Aegify secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Security rules contain detector regexes, not credentials"
paths = [
  '''^rules/secrets/''',
]

[[allowlists]]
description = "Documented non-secret development placeholders"
regexTarget = "match"
regexes = [
  '''generate-a-random-secret-here''',
  '''generate-a-separate-random-token-here''',
  '''dev-secret-not-for-production''',
]

[[allowlists]]
description = "Exact non-secret literals removed after the initial publication scan"
regexTarget = "match"
regexes = [
  '''Authorization: Token YOUR_TOKEN''',
  '''ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''',
]
