rules:
  - id: "AEG-SECRET-001"
    name: "AWS access key hardcoded in source code"
    description: >
      An AWS access key ID (beginning with AKIA, ASIA, or AIDA) or secret
      access key is hardcoded in source code. AWS credentials in source code
      are the leading cause of cloud account compromise. Attackers who gain
      access to repositories (through leaked code, compromised CI/CD, or
      insider access) can immediately use these credentials for unauthorized
      AWS resource access, data exfiltration, cryptocurrency mining, and
      lateral movement across cloud infrastructure.
    severity: critical
    confidence: 0.95
    languages: [python, javascript, java, go, ruby, php, csharp, typescript, shell]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "regex"
        match: "(AKIA|ASIA|AIDA)[A-Z0-9]{16}"
      - pattern_type: "regex"
        match: "(aws_secret_access_key|aws_secret_key|AWS_SECRET_ACCESS_KEY|AWS_SECRET_KEY)\\s*[=:]\\s*['\"][A-Za-z0-9/+=]{40}['\"]"
      - pattern_type: "regex"
        match: "(aws_access_key_id|aws_access_key|AWS_ACCESS_KEY_ID|AWS_ACCESS_KEY)\\s*[=:]\\s*['\"]AKIA[A-Z0-9]{16}['\"]"
      - pattern_type: "regex"
        match: "boto3\\.client\\(.*aws_access_key_id\\s*=\\s*['\"]AKIA"
      - pattern_type: "regex"
        match: "AWS\\.config\\.update\\(\\{.*accessKeyId\\s*:\\s*['\"]AKIA"
    defense_patterns:
      - "aws_iam_roles"
      - "environment_variables"
      - "aws_secrets_manager"
      - "aws_parameter_store"
      - "instance_profile_credentials"
      - "oidc_federation"
    message: "AWS access key is hardcoded in source code. Use IAM roles for EC2/ECS/Lambda, environment variables for local development, or AWS Secrets Manager/Parameter Store for application configuration. Immediately rotate the exposed key via the AWS IAM console."

  - id: "AEG-SECRET-002"
    name: "Private key embedded in source code"
    description: >
      A private cryptographic key (RSA, DSA, EC, Ed25519, PGP) is embedded
      directly in source code. Private keys in source code are permanently
      compromised because they persist in version control history even after
      removal. Compromised private keys enable impersonation of servers
      (TLS/SSL), forging of digital signatures, decryption of encrypted
      communications, and unauthorized SSH access to infrastructure.
    severity: critical
    confidence: 0.97
    languages: [python, javascript, java, go, ruby, php, csharp, typescript, shell]
    cwe_id: 321
    owasp_category: "A02:2021-Cryptographic Failures"
    patterns:
      - pattern_type: "regex"
        match: "-----BEGIN (RSA |DSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----"
      - pattern_type: "regex"
        match: "-----BEGIN PGP PRIVATE KEY BLOCK-----"
      - pattern_type: "regex"
        match: "(private_key|privateKey|PRIVATE_KEY|privkey|priv_key)\\s*[=:]\\s*['\"`]-----BEGIN"
      - pattern_type: "regex"
        match: "(private_key|privateKey|PRIVATE_KEY|ssh_key|signing_key)\\s*[=:]\\s*['\"`][A-Za-z0-9+/=\\\\n]{100,}['\"`]"
    defense_patterns:
      - "key_management_service"
      - "hardware_security_module"
      - "vault_secret_engine"
      - "certificate_manager"
      - "key_file_with_permissions"
      - "environment_variable_injection"
    message: "A private cryptographic key is embedded in source code. Store private keys in a dedicated key management service (AWS KMS, HashiCorp Vault, Azure Key Vault), HSM, or as file references with restricted permissions (0600). Immediately revoke and rotate the compromised key."

  - id: "AEG-SECRET-003"
    name: "Database connection string with embedded credentials"
    description: >
      A database connection string or URI containing plaintext username and
      password is hardcoded in source code. Database credentials in code
      grant direct access to production data stores, bypassing application-
      level access controls. Connection strings often include the database
      host and port, enabling direct network connections to database servers
      even from outside the application environment.
    severity: critical
    confidence: 0.92
    languages: [python, javascript, java, go, ruby, php, csharp, typescript]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "regex"
        match: "(mysql|postgres|postgresql|mongodb|mongodb\\+srv|redis|amqp|mssql)://[^\\s:]+:[^\\s@]+@[^\\s/]+"
      - pattern_type: "regex"
        match: "(DATABASE_URL|DB_URL|MONGODB_URI|REDIS_URL|SQLALCHEMY_DATABASE_URI|JDBC_URL|ConnectionString)\\s*[=:]\\s*['\"]\\w+://[^\\s:]+:[^\\s@]+@"
      - pattern_type: "regex"
        match: "(Server|Data Source|Host)=[^;]+;.*(Password|Pwd)=[^;\"']+"
      - pattern_type: "regex"
        match: "DriverManager\\.getConnection\\(['\"]jdbc:\\w+://.*['\"],\\s*['\"]\\w+['\"],\\s*['\"][^'\"]+['\"]\\)"
      - pattern_type: "regex"
        match: "createConnection\\(\\{[^}]*password\\s*:\\s*['\"][^'\"]+['\"]"
        multiline: true
    defense_patterns:
      - "environment_variable_credentials"
      - "secrets_manager_integration"
      - "vault_dynamic_credentials"
      - "iam_database_authentication"
      - "connection_string_from_config_service"
    message: "Database connection string with embedded credentials is hardcoded in source code. Use environment variables, a secrets manager (HashiCorp Vault, AWS Secrets Manager), or IAM-based database authentication. Never include passwords in connection strings committed to version control."

  - id: "AEG-SECRET-004"
    name: "Third-party API key pattern detected in source code"
    description: >
      A recognizable third-party API key pattern (Stripe, Twilio, SendGrid,
      Mailgun, or similar services) is hardcoded in source code. These API
      keys provide direct access to paid services and can be used for
      financial fraud (Stripe), unauthorized communication sending (Twilio,
      SendGrid), and data access. Many of these services charge per-use,
      meaning compromised keys can result in significant financial loss from
      unauthorized usage.
    severity: critical
    confidence: 0.93
    languages: [python, javascript, java, go, ruby, php, csharp, typescript, shell]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "regex"
        match: "(sk_live_|sk_test_|pk_live_|pk_test_|rk_live_|rk_test_)[a-zA-Z0-9]{20,}"
        description: "Stripe API key"
      - pattern_type: "regex"
        match: "AC[a-f0-9]{32}"
        description: "Twilio Account SID"
      - pattern_type: "regex"
        match: "SG\\.[a-zA-Z0-9_-]{22}\\.[a-zA-Z0-9_-]{43}"
        description: "SendGrid API key"
      - pattern_type: "regex"
        match: "key-[a-f0-9]{32}"
        description: "Mailgun API key"
      - pattern_type: "regex"
        match: "xox[bpas]-[a-zA-Z0-9-]{10,}"
        description: "Slack token"
      - pattern_type: "regex"
        match: "ghp_[a-zA-Z0-9]{36}"
        description: "GitHub personal access token"
      - pattern_type: "regex"
        match: "glpat-[a-zA-Z0-9_-]{20,}"
        description: "GitLab personal access token"
      - pattern_type: "regex"
        match: "sq0[a-z]{3}-[a-zA-Z0-9_-]{22,}"
        description: "Square API key"
    defense_patterns:
      - "environment_variable_injection"
      - "secrets_manager_retrieval"
      - "key_rotation_policy"
      - "service_specific_credential_management"
      - "pre_commit_secret_scanning"
    message: "A third-party API key with a recognizable pattern is hardcoded in source code. Move all API keys to environment variables or a secrets manager. Enable pre-commit hooks with secret scanning (e.g., git-secrets, detect-secrets) to prevent future credential commits. Rotate the exposed key immediately."

  - id: "AEG-SECRET-005"
    name: "OAuth client secret hardcoded in application"
    description: >
      An OAuth 2.0 client secret is hardcoded in application source code.
      The client secret is a confidential credential used to authenticate
      the application to the authorization server during token exchange. A
      compromised client secret allows attackers to impersonate the
      application, exchange authorization codes for access tokens, and
      gain unauthorized access to user data through the OAuth provider.
      For public clients (SPAs, mobile apps), client secrets should never
      be used at all.
    severity: critical
    confidence: 0.88
    languages: [python, javascript, java, go, ruby, php, csharp, typescript]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "regex"
        match: "(client_secret|clientSecret|CLIENT_SECRET|OAUTH_SECRET|oauth_client_secret)\\s*[=:]\\s*['\"][a-zA-Z0-9_-]{20,}['\"]"
      - pattern_type: "regex"
        match: "(GOOGLE_CLIENT_SECRET|GITHUB_CLIENT_SECRET|FACEBOOK_APP_SECRET|TWITTER_API_SECRET|AZURE_CLIENT_SECRET|OKTA_CLIENT_SECRET|AUTH0_CLIENT_SECRET)\\s*[=:]\\s*['\"][^'\"]{10,}['\"]"
      - pattern_type: "regex"
        match: "OAuth2\\w*\\(.*client_secret\\s*=\\s*['\"][^'\"]{10,}['\"]"
      - pattern_type: "regex"
        match: "(passport\\.use|OAuthStrategy|OAuth2Strategy)\\(.*clientSecret\\s*:\\s*['\"][^'\"]{10,}['\"]"
        multiline: true
    defense_patterns:
      - "environment_variable_configuration"
      - "secrets_manager_integration"
      - "pkce_for_public_clients"
      - "oauth_credential_rotation"
      - "vault_oidc_integration"
    message: "OAuth client secret is hardcoded in source code. Store client secrets in environment variables or a secrets manager. For public clients (SPAs, mobile apps), use PKCE flow instead of client secrets. Rotate the compromised secret immediately through the OAuth provider's dashboard."

  - id: "AEG-SECRET-006"
    name: "JWT signing secret hardcoded in application"
    description: >
      A JWT signing secret or HMAC key is hardcoded in application source
      code. The JWT signing secret is the sole security control preventing
      token forgery. With this secret, an attacker can create arbitrary JWT
      tokens with any claims (user ID, roles, permissions), effectively
      granting themselves full administrative access to the application.
      This is equivalent to having a master key to the entire
      authentication system.
    severity: critical
    confidence: 0.90
    languages: [python, javascript, java, go, ruby, php, csharp, typescript]
    cwe_id: 798
    owasp_category: "A02:2021-Cryptographic Failures"
    patterns:
      - pattern_type: "regex"
        match: "(JWT_SECRET|jwt_secret|JWT_KEY|jwt_key|JWT_SECRET_KEY|jwt_secret_key|SECRET_KEY|SIGNING_KEY|signing_key|TOKEN_SECRET|token_secret)\\s*[=:]\\s*['\"][^'\"]{8,}['\"]"
        negative_match: "(os\\.environ|process\\.env|getenv|config\\.|settings\\.|ENV\\[|System\\.getenv|os\\.Getenv)"
      - pattern_type: "regex"
        match: "(jwt\\.encode|jwt\\.sign|JWT\\.encode|jose\\.sign|JWTSigner|Jwts\\.builder)\\(.*['\"][a-zA-Z0-9_!@#$%^&*]{8,}['\"]"
      - pattern_type: "regex"
        match: "Algorithm\\.HMAC(256|384|512).*['\"][a-zA-Z0-9_!@#$%^&*]{8,}['\"]"
      - pattern_type: "regex"
        match: "(jsonwebtoken|PyJWT|jose|jwt-go|auth0/jwt)\\..*secret\\s*[=:]\\s*['\"][^'\"]{8,}['\"]"
    defense_patterns:
      - "environment_variable_jwt_secret"
      - "asymmetric_jwt_signing_rs256"
      - "key_management_service"
      - "secret_rotation_policy"
      - "jwks_endpoint_for_verification"
    message: "JWT signing secret is hardcoded in source code. An attacker with this secret can forge arbitrary authentication tokens. Use environment variables or a KMS for the signing secret, or preferably switch to asymmetric signing (RS256/ES256) with public/private key pairs and JWKS endpoints."

  - id: "AEG-SECRET-007"
    name: "Cloud provider credentials hardcoded in source code"
    description: >
      Cloud provider credentials (GCP service account keys, Azure client
      secrets, DigitalOcean tokens, Heroku API keys, or other cloud
      platform credentials) are hardcoded in source code. Cloud credentials
      typically grant broad access to infrastructure resources including
      compute, storage, databases, and networking. Compromised cloud
      credentials are the primary vector for cloud infrastructure
      attacks, resource hijacking, and large-scale data breaches.
    severity: critical
    confidence: 0.90
    languages: [python, javascript, java, go, ruby, php, csharp, typescript, shell]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "regex"
        match: "['\"]type['\"]\\s*:\\s*['\"]service_account['\"].*['\"]private_key['\"]\\s*:\\s*['\"]-----BEGIN"
        description: "GCP service account JSON key"
        multiline: true
      - pattern_type: "regex"
        match: "(AZURE_CLIENT_SECRET|AZURE_TENANT_ID|AZURE_SUBSCRIPTION_KEY|azure_storage_key)\\s*[=:]\\s*['\"][a-zA-Z0-9+/=]{20,}['\"]"
        description: "Azure credentials"
      - pattern_type: "regex"
        match: "(DO_API_TOKEN|DIGITALOCEAN_TOKEN|DIGITALOCEAN_ACCESS_TOKEN)\\s*[=:]\\s*['\"][a-f0-9]{64}['\"]"
        description: "DigitalOcean API token"
      - pattern_type: "regex"
        match: "(HEROKU_API_KEY|HEROKU_API_TOKEN)\\s*[=:]\\s*['\"][a-f0-9-]{36,}['\"]"
        description: "Heroku API key"
      - pattern_type: "regex"
        match: "(CLOUDFLARE_API_KEY|CF_API_KEY)\\s*[=:]\\s*['\"][a-f0-9]{37}['\"]"
        description: "Cloudflare API key"
      - pattern_type: "regex"
        match: "(GCP_CREDENTIALS|GOOGLE_APPLICATION_CREDENTIALS|GOOGLE_API_KEY)\\s*[=:]\\s*['\"][^'\"]{20,}['\"]"
        negative_match: "(os\\.environ|process\\.env|getenv|config\\.|ENV\\[)"
        description: "GCP credentials"
    defense_patterns:
      - "workload_identity_federation"
      - "managed_identity"
      - "service_account_impersonation"
      - "cloud_secrets_manager"
      - "environment_variable_injection"
      - "oidc_provider_authentication"
    message: "Cloud provider credentials are hardcoded in source code. Use workload identity federation (GCP), managed identities (Azure), IAM roles (AWS), or equivalent platform-native authentication. For local development, use environment variables or credential helper tools. Revoke and rotate the exposed credentials immediately."

  - id: "AEG-SECRET-008"
    name: "Generic high-entropy string likely to be a secret"
    description: >
      A variable or configuration assignment whose name suggests it holds
      a secret (containing keywords like secret, password, token, key,
      credential, auth) is assigned a high-entropy string literal. High
      entropy indicates the string is likely a real credential rather than
      a placeholder or default value. This catch-all rule detects secrets
      that do not match specific provider patterns but exhibit the naming
      and entropy characteristics of real credentials.
    severity: high
    confidence: 0.65
    languages: [python, javascript, java, go, ruby, php, csharp, typescript, shell]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - pattern_type: "entropy"
        match: "(secret|password|passwd|pwd|token|api_key|apikey|access_key|auth_key|private_key|signing_key|encryption_key|master_key|credential|auth_token)\\s*[=:]\\s*['\"][^'\"]{16,}['\"]"
        entropy_threshold: 4.0
        negative_match: "(os\\.environ|process\\.env|getenv|config\\.|settings\\.|ENV\\[|System\\.getenv|os\\.Getenv|\\{\\{|\\$\\{|<|%)"
      - pattern_type: "entropy"
        match: "(SECRET|PASSWORD|TOKEN|API_KEY|APIKEY|ACCESS_KEY|AUTH_KEY|PRIVATE_KEY|SIGNING_KEY|ENCRYPTION_KEY|MASTER_KEY|CREDENTIAL)\\s*[=:]\\s*['\"][A-Za-z0-9+/=_-]{16,}['\"]"
        entropy_threshold: 3.8
        negative_match: "(os\\.environ|process\\.env|getenv|config\\.|settings\\.|ENV\\[|System\\.getenv|os\\.Getenv|\\{\\{|\\$\\{|example|changeme|replace|placeholder|your_|TODO|FIXME)"
      - pattern_type: "regex"
        match: "(export\\s+)?(SECRET|PASSWORD|TOKEN|API_KEY|AUTH|CREDENTIAL)\\w*\\s*=\\s*['\"][A-Za-z0-9+/=_!@#$%^&*-]{20,}['\"]"
        negative_match: "(\\$\\{|\\$\\(|`|\\{\\{|changeme|example|placeholder|your_|xxx|000|test|dummy|fake|mock|sample)"
    defense_patterns:
      - "secrets_manager_for_all_credentials"
      - "environment_variable_pattern"
      - "pre_commit_entropy_scanning"
      - "vault_integration"
      - "credential_rotation_policy"
      - "git_secrets_pre_commit_hook"
    message: "A high-entropy string is assigned to a variable whose name indicates it is a secret or credential. Move all secrets to environment variables or a dedicated secrets manager. Install pre-commit hooks with entropy-based secret detection (detect-secrets, trufflehog) to prevent future credential commits."
