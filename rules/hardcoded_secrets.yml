rules:
  - id: AEG-SEC-001
    name: Hardcoded Password
    description: >
      Password or secret key is hardcoded in source code.
      Use environment variables or a secrets manager instead.
    severity: high
    confidence: 0.75
    languages: [python, javascript, typescript, java, go]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: ".*"
        args_match: '(password|passwd|secret|api_key|apikey|token|private_key)\s*=\s*["\x27][^"\x27]{4,}'
    message: "Hardcoded secret detected in call to '{callee}' at line {line}"

  - id: AEG-SEC-002
    name: Hardcoded AWS Credentials
    description: >
      AWS access key or secret key appears to be hardcoded.
    severity: critical
    confidence: 0.9
    languages: [python, javascript, typescript, java, go]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: ".*"
        args_match: '(AKIA[0-9A-Z]{16}|aws_secret_access_key\s*=\s*["\x27])'
    message: "Hardcoded AWS credential detected at line {line}"
