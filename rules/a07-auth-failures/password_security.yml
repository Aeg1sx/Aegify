rules:
  - id: "AEG-PASS-001"
    name: "Plaintext password storage"
    description: >
      The application stores user passwords in plaintext or using reversible encoding
      (Base64, ROT13, XOR) rather than a strong one-way adaptive hashing algorithm.
      If the database is compromised, all user passwords are immediately exposed,
      enabling account takeover across this and other services where users reuse
      passwords.
    severity: critical
    confidence: 0.95
    languages: [python, javascript, typescript, java, ruby, php, go]
    cwe_id: 256
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - assignment_match: "password|passwd|pass_word"
        context: "INSERT|save|create|update|store|write"
        missing_context: "hash|bcrypt|scrypt|argon2|pbkdf2|crypt"
      - callee_match: "execute|query|run"
        args_match: "INSERT.*password.*VALUES.*%s|INSERT.*password.*VALUES.*\\$"
        missing_context: "hash|bcrypt|argon2"
      - multi_match:
          - "password|passwd"
          - "base64|encode|btoa|Buffer\\.from"
        context: "store|save|insert|database"
      - callee_match: "md5|sha1|sha256"
        args_match: "password|passwd"
        note: "Unsalted fast hashes are inadequate for passwords"
    defense_patterns:
      - "bcrypt|argon2|scrypt|pbkdf2"
      - "generate_password_hash"
      - "hashpw|hashSync"
      - "PasswordEncoder|BCryptPasswordEncoder"
      - "has_secure_password"
      - "password_hash\\(.*PASSWORD_BCRYPT"
    message: "Password is stored without proper hashing. Use bcrypt, argon2, or scrypt with a cost factor appropriate for your hardware. Never use MD5, SHA-1, or SHA-256 alone for password storage."

  - id: "AEG-PASS-002"
    name: "Weak password validation policy"
    description: >
      The application enforces weak or no password complexity requirements, allowing
      users to set passwords that are easily guessable or appear in common password
      lists. Weak passwords are vulnerable to brute force, dictionary attacks, and
      credential stuffing using known breached password databases.
    severity: high
    confidence: 0.8
    languages: [python, javascript, typescript, java, ruby, php, go]
    cwe_id: 521
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - multi_match:
          - "password|passwd"
          - "len|length|size"
          - "<\\s*[1-7]\\b|<=\\s*[1-6]\\b"
      - callee_match: "validate_password|check_password_strength|password_policy"
        args_match: "min.*length.*[1-7]\\b|minLength.*[1-7]\\b"
      - assignment_match: "MIN_PASSWORD_LENGTH|PASSWORD_MIN_LENGTH|minLength"
        value_match: "[1-7]\\b"
      - multi_match:
          - "password"
          - "register|signup|create_user|set_password"
        missing_match:
          - "validate|strength|complexity|min.*length|policy"
    defense_patterns:
      - "MIN_PASSWORD_LENGTH.*[89]|MIN_PASSWORD_LENGTH.*1[0-9]"
      - "password_validators|AUTH_PASSWORD_VALIDATORS"
      - "zxcvbn|haveibeenpwned|password_strength"
      - "complexity_check|entropy"
      - "CommonPasswordValidator|breached_password"
    message: "Password policy is too weak or nonexistent. Enforce a minimum length of 12 characters, check against breached password databases, and consider using zxcvbn for strength estimation."

  - id: "AEG-PASS-003"
    name: "Password transmitted in URL"
    description: >
      The application sends passwords as URL query parameters via GET requests.
      Passwords in URLs are recorded in browser history, web server access logs,
      proxy logs, analytics platforms, and the Referer header, creating multiple
      persistence points where credentials can be harvested by attackers.
    severity: critical
    confidence: 0.95
    languages: [python, javascript, typescript, java, ruby, php, go]
    cwe_id: 598
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee_match: "fetch|axios\\.get|http\\.get|requests\\.get|GET"
        args_match: "password=|passwd=|pass=|pwd="
      - callee_match: "redirect|navigate|window\\.location"
        args_match: "\\?.*password=|&password=|\\?.*pwd="
      - callee_match: "route|get|@GetMapping|@RequestMapping.*GET"
        args_match: "password|passwd"
        note: "Login endpoint accepting passwords via GET"
      - assignment_match: "url|href|link"
        value_match: "password=|passwd=|pwd="
    defense_patterns:
      - "POST|post"
      - "req\\.body\\.password|request\\.POST"
      - "@PostMapping|@RequestMapping.*POST"
      - "method.*POST"
    message: "Password is transmitted as a URL parameter. Always send passwords in the request body via POST over HTTPS. Never include credentials in URLs or query strings."

  - id: "AEG-PASS-004"
    name: "Missing brute force protection on authentication"
    description: >
      The application's authentication endpoint does not implement rate limiting,
      account lockout, or progressive delays. Without brute force protection,
      attackers can make unlimited login attempts to guess passwords through
      automated tools, dictionary attacks, or credential stuffing with breached
      credential lists.
    severity: high
    confidence: 0.75
    languages: [python, javascript, typescript, java, ruby, php, go]
    cwe_id: 307
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - multi_match:
          - "login|authenticate|sign_in|verify_credentials"
          - "route|endpoint|handler|controller|view|post"
        missing_match:
          - "rate_limit|throttle|lockout|max_attempts|failed_attempts|brute_force|captcha|delay"
      - callee_match: "login|authenticate"
        context: "controller|view|handler|route"
        missing_sibling: "rate_limit|throttle|lockout|failed_login_count"
    defense_patterns:
      - "rate_limit|rateLimit|throttle"
      - "account_lockout|lockout_threshold"
      - "failed_attempts|login_attempts"
      - "max_attempts|MAX_LOGIN_ATTEMPTS"
      - "captcha|recaptcha|hCaptcha"
      - "progressive_delay|exponential_backoff"
      - "django-axes|rack-attack|express-rate-limit"
    message: "Authentication endpoint lacks brute force protection. Implement rate limiting, account lockout after failed attempts, and consider CAPTCHA for suspicious activity."

  - id: "AEG-PASS-005"
    name: "Predictable password reset token"
    description: >
      The application generates password reset tokens using predictable sources
      such as timestamps, sequential IDs, user data, or weak random number
      generators. An attacker can predict or brute force the reset token to
      take over any user account by completing the password reset flow.
    severity: critical
    confidence: 0.85
    languages: [python, javascript, typescript, java, ruby, php, go]
    cwe_id: 640
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - multi_match:
          - "reset_token|password_token|recovery_token|reset_code"
          - "time\\(|Date\\.now|timestamp|user_id|email|md5|sha1|random\\(|Math\\.random|rand\\("
      - callee_match: "md5|sha1|sha256"
        args_match: "email|user_id|username|timestamp|time\\("
        context: "reset|recovery|forgot"
      - assignment_match: "reset_token|recovery_token|reset_code"
        value_match: "Math\\.random|random\\.random|rand\\(|uuid1|time\\("
      - callee_match: "generate_reset_token|create_reset_token"
        args_match: "user_id|email|timestamp"
        missing_args: "secrets|crypto|SecureRandom"
    defense_patterns:
      - "secrets\\.token_urlsafe|secrets\\.token_hex"
      - "crypto\\.randomBytes|crypto\\.getRandomValues"
      - "SecureRandom"
      - "random_bytes|openssl_random_pseudo_bytes"
      - "uuid4|uuid\\.v4"
      - "token_generator\\.make_token"
    message: "Password reset token is generated from predictable sources. Use cryptographically secure random generators (secrets module, crypto.randomBytes) with at least 128 bits of entropy."
