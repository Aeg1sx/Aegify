rules:
  - id: CG-A07-001
    name: Weak Password Requirements
    description: >
      Password validation enforces a minimum length below 8 characters or
      lacks complexity requirements. Weak password policies enable brute
      force attacks, credential stuffing, and dictionary attacks. NIST
      SP 800-63B recommends a minimum of 8 characters with no maximum
      length restriction.
    severity: medium
    confidence: 0.7
    languages: [python, javascript, typescript, java, go]
    cwe_id: 521
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: ".*"
        args_match: '(min_length|minLength|minimum_length|MIN_PASSWORD_LENGTH|PASSWORD_MIN_LENGTH)\s*[:=]\s*[1-7]\b'
      - callee: ".*"
        args_match: '(password|passwd).*len(gth)?\s*(<|<=|>=?\s*)\s*[1-7]\b'
      - callee: "(MinLengthValidator|PasswordValidator|PasswordPolicy)"
        args_match: '(min_length|minLength)\s*[:=]\s*[1-7]\b'
      - callee: ".*"
        args_match: '\.{0,3}(password|passwd).{0,30}\.length\s*(<|<=)\s*[1-7]\b'
    message: >
      Weak password requirement at '{callee}' (line {line}). Enforce a minimum
      password length of 8 characters per NIST SP 800-63B guidelines.

  - id: CG-A07-004
    name: JWT None Algorithm Accepted
    description: >
      JWT verification accepts the 'none' algorithm, which allows tokens
      without any cryptographic signature. Attackers can forge arbitrary JWT
      tokens by setting the algorithm to 'none' and stripping the signature,
      bypassing all authentication controls.
    severity: critical
    confidence: 0.95
    languages: [python, javascript, typescript, java, go]
    cwe_id: 345
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: "(jwt\\.decode|jwt\\.verify|JWT\\.decode|Jwts\\.parser)"
        args_match: '(algorithms\s*=\s*\[.*["\x27]none["\x27]|algorithm\s*[:=]\s*["\x27]none["\x27]|alg.*none)'
      - callee: "(jsonwebtoken\\.verify|jose\\.jwtVerify|nimbus.*JWTProcessor)"
        args_match: '(algorithms?\s*[:=].*none|allowNoneAlgorithm|setJWSAlgorithm.*none)'
      - callee: "(jwt\\.Parse|jwt\\.ParseWithClaims)"
        args_match: "(SigningMethodNone|UnsafeAllowNoneSignatureType)"
    message: >
      JWT 'none' algorithm accepted at '{callee}' (line {line}). Never allow
      the 'none' algorithm. Explicitly specify allowed algorithms like
      HS256 or RS256.

  - id: CG-A07-005
    name: Hardcoded JWT Secret
    description: >
      JWT signing uses a hardcoded string literal as the secret key. If the
      secret is exposed through source code, version control, or decompilation,
      attackers can forge valid JWT tokens to impersonate any user.
    severity: critical
    confidence: 0.9
    languages: [python, javascript, typescript, java, go]
    cwe_id: 798
    owasp_category: "A07:2021-Identification and Authentication Failures"
    defense_patterns: ["os.environ", "os.getenv", "process.env", "System.getenv", "config", "vault", "secrets_manager"]
    patterns:
      - callee: "(jwt\\.encode|jwt\\.sign|jwt\\.decode|jwt\\.verify)"
        args_match: '(key|secret|SECRET_KEY)\s*[:=]\s*["\x27][A-Za-z0-9+/=_\-!@#$%^&*]{6,}["\x27]'
      - callee: "(Jwts\\.builder|JWT\\.create|jwt\\.NewWithClaims)"
        args_match: '(signWith|sign|SignedString)\s*\(.*["\x27][A-Za-z0-9+/=_\-]{6,}["\x27]'
      - callee: "(jsonwebtoken\\.(sign|verify)|jose\\.(SignJWT|jwtVerify))"
        args_match: '["\x27][A-Za-z0-9+/=_\-!@#$%^&*]{6,}["\x27]'
    message: >
      Hardcoded JWT secret at '{callee}' (line {line}). Store JWT secrets
      in environment variables or a secrets manager, never in source code.

  - id: CG-A07-006
    name: Session Token in URL
    description: >
      Session tokens, authentication tokens, or API keys are passed as URL
      query parameters. Tokens in URLs are exposed in browser history, server
      logs, referrer headers, proxy logs, and browser extensions, significantly
      increasing the risk of session hijacking.
    severity: high
    confidence: 0.8
    languages: [python, javascript, typescript, java, go]
    cwe_id: 598
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: "(redirect|url_for|reverse|Response|fetch|request|http\\.(Get|Post)|HttpClient)"
        args_match: '(\\?|&)(session_id|sessionid|token|access_token|auth_token|api_key|apikey|jwt|sid|JSESSIONID)='
      - callee: "(window\\.location|location\\.href|location\\.assign|router\\.push|navigate)"
        args_match: '(\\?|&)(session|token|access_token|auth_token|api_key|jwt|sid)='
      - callee: ".*"
        args_match: '(url|URL|href|link)\s*[:=].*["\x27].*[?&](token|session_id|api_key|access_token|auth_token)='
    message: >
      Session token passed in URL at '{callee}' (line {line}). Transmit
      tokens via Authorization headers or Secure/HttpOnly cookies instead
      of URL query parameters.

  - id: CG-A07-007
    name: Missing Password Hashing
    description: >
      User passwords are stored, compared, or transmitted in plaintext
      without cryptographic hashing. Plaintext password storage allows
      mass credential theft if the database is compromised. Use bcrypt,
      scrypt, Argon2, or PBKDF2 with appropriate work factors.
    severity: critical
    confidence: 0.75
    languages: [python, javascript, typescript, java, go]
    cwe_id: 256
    owasp_category: "A07:2021-Identification and Authentication Failures"
    defense_patterns: ["bcrypt", "scrypt", "argon2", "pbkdf2", "hash_password", "make_password", "generate_password_hash", "password_hash", "HashPassword"]
    patterns:
      - callee: "(execute|query|raw|cursor\\.execute|db\\.query|session\\.execute)"
        args_match: "(INSERT|UPDATE|insert|update).*(password|passwd|pwd).*VALUES?\\s*\\("
      - callee: "(save|create|insert|update|findOneAndUpdate|updateOne)"
        args_match: '(password|passwd|pwd)\s*[:=]\s*(request|req|params|body|form|data)\.'
      - callee: "(==|!=|equals|compareTo|strcmp)"
        args_match: '(password|passwd|pwd)\s*(==|!=|\.equals|\.compareTo)\s*(request|req|params|input|form)'
    message: >
      Plaintext password operation at '{callee}' (line {line}). Never store
      or compare passwords in plaintext. Use bcrypt, Argon2, or scrypt with
      a per-user salt and appropriate work factor.

  - id: CG-A07-008
    name: Permissive CORS with Credentials
    description: >
      Cross-Origin Resource Sharing (CORS) is configured to allow credentials
      (cookies, Authorization headers) with a wildcard origin or overly
      permissive origin pattern. This combination allows any website to make
      authenticated requests on behalf of users, enabling CSRF-like attacks.
    severity: high
    confidence: 0.85
    languages: [python, javascript, typescript, java, go]
    cwe_id: 942
    owasp_category: "A07:2021-Identification and Authentication Failures"
    patterns:
      - callee: "(CORS|cors|CorsRegistry|CorsConfiguration)"
        args_match: '(credentials|allow_credentials|supports_credentials|allowCredentials)\s*[:=]\s*[Tt]rue.*(origin|allow_origin|allowedOrigins)\s*[:=]\s*["\x27]\*["\x27]'
      - callee: "(CORS|cors|CorsRegistry|CorsConfiguration)"
        args_match: '(origin|allow_origin|allowedOrigins)\s*[:=]\s*["\x27]\*["\x27].*(credentials|allow_credentials|supports_credentials|allowCredentials)\s*[:=]\s*[Tt]rue'
      - callee: "(res\\.header|res\\.setHeader|response\\.headers|Header|w\\.Header)"
        args_match: 'Access-Control-Allow-Origin.*\*.*Access-Control-Allow-Credentials.*true'
      - callee: "(res\\.header|res\\.setHeader|response\\.headers)"
        args_match: 'Access-Control-Allow-Credentials.*true.*Access-Control-Allow-Origin.*\*'
    message: >
      Permissive CORS with credentials at '{callee}' (line {line}). Never
      combine Access-Control-Allow-Credentials: true with wildcard origins.
      Specify explicit allowed origins when credentials are enabled.
