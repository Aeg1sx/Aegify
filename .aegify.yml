scan:
  languages: [python, javascript, typescript, java, kotlin, go, rust, swift]
  # Preserve the full self-scan result set. Individual rules still have bounded inputs.
  max_findings_per_rule: 0
  max_findings_per_file: 0
  exclude:
    - "tests/**"
    - "**/test/**"
    - "**/tests/**"
    - "**/__tests__/**"
    - "**/src/test/**"
    - "**/src/testFixtures/**"
    - "vendor/**"
    - "**/vendor/**"
    - "node_modules/**"
    - "**/node_modules/**"
    - ".git/**"
    - "**/.git/**"
    - ".gradle/**"
    - "**/.gradle/**"
    - "__pycache__/**"
    - "**/__pycache__/**"
    - "venv/**"
    - "**/venv/**"
    - ".venv/**"
    - "**/.venv/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/target/**"
    - "**/.next/**"
    - "**/generated/**"
    - "**/__generated__/**"
    # Owned vulnerable controls are exercised only by the digest-bound benchmark gate.
    - "scanner/benchmarks/**"

taint:
  # This repository exceeded the library default of 10,000 call-string contexts.
  # Reaching this explicit bound still makes the scan partial and fails CI.
  max_contexts: 50000
  context_depth: 2
  max_iterations: 64

rules:
  severity_threshold: medium
  disabled_rules: []

llm:
  enabled: false
  model: claude-opus-4-6
  token_budget: 100000
  verify_threshold: 0.7

reporting:
  sarif: true
  github_comment: true

context:
  auth_patterns:
    - "@auth_required"
    - "@login_required"
    - "requireAuth"
    - "@permission_required"
    - "@jwt_required"
  sanitizer_patterns:
    - "parameterized"
    - "escape"
    - "sanitize"
    - "clean"
    - "validate"
    - "html.escape"
    - "bleach.clean"
    - "shlex.quote"
    - "DOMPurify"
