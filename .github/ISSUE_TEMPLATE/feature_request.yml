name: Feature request
description: Propose a bounded analysis, platform, rule, or workflow improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Explain the security or engineering decision this enables.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include evidence fidelity, false-positive, and scale expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and limitations
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal does not require unauthorized testing or submission of private code/data.
          required: true
