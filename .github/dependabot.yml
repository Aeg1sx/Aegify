version: 2
updates:
  - package-ecosystem: pip
    directory: /scanner
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7
    groups:
      docs-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /scanner
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    reviewers: [Aeg1sx]
    cooldown:
      default-days: 7
