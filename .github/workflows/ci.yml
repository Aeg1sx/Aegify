name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Enforce immutable dependency references
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/verify_supply_chain.py

  scanner:
    name: Scanner / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scanner
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: scanner/uv.lock

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Audit Python dependencies
        run: uv audit --frozen

      - name: Lint and format check
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests

      - name: Type check
        run: uv run mypy --strict src/aegify

      - name: Audit bundled rule DSL
        run: uv run aegify audit-rules ../rules --strict

      - name: Test with coverage
        run: uv run pytest -v --cov=aegify --cov-report=term-missing --cov-fail-under=60

      - name: Gate versioned core precision corpus
        run: |
          uv run aegify benchmark benchmarks/core-v1/sources \
            --ground-truth benchmarks/core-v1/ground-truth.json \
            --min-precision 1.0 \
            --min-recall 1.0 \
            --output-file benchmark-report.json

      - name: Upload precision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegify-core-precision-report
          path: scanner/benchmark-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegify-wheel
          path: scanner/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  dashboard:
    name: Dashboard / Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    env:
      DATABASE_URL: file:./ci.db
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_URL: http://localhost:3000
      AUTH_GITHUB_ID: ci-only-client-id
      AUTH_GITHUB_SECRET: ci-only-client-secret
      AUTH_ALLOWED_EMAILS: ci-only@example.test
      AUTH_ADMIN_EMAILS: ci-only@example.test
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          auth_test_secret=$(openssl rand -hex 32)
          encryption_test_secret=$(openssl rand -hex 32)
          echo "::add-mask::$auth_test_secret"
          echo "::add-mask::$encryption_test_secret"
          echo "AUTH_SECRET=$auth_test_secret" >> "$GITHUB_ENV"
          echo "ENCRYPTION_SECRET=$encryption_test_secret" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit signatures --include-attestations

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Apply migrations to a fresh database
        run: npx --no-install prisma migrate deploy

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify project access through production HTTP routes
        run: npm run test:access

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINTLIFY_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install locked documentation tooling
        run: npm ci --ignore-scripts

      - name: Audit documentation dependencies
        run: |
          npm audit --audit-level=high
          npm audit signatures --include-attestations

      - name: Validate Mintlify documentation
        run: npm run check

  container:
    name: Scanner container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build scanner image
        run: docker build --pull --file scanner/Dockerfile --tag aegify-scanner:ci .

      - name: Smoke test scanner image
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges aegify-scanner:ci --help

      - name: Build dashboard image
        run: docker build --pull --file dashboard/Dockerfile --tag aegify-dashboard:ci dashboard

      - name: Smoke test dashboard image
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' aegify-dashboard:ci)" = "nextjs"
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges aegify-dashboard:ci node --version

      - name: Build durable source worker image
        run: docker build --pull --file dashboard/Dockerfile.worker --tag aegify-worker:ci .

      - name: Verify worker contracts without network access
        run: |
          docker run --rm --read-only --network none --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1001,gid=1001,size=536870912 \
            --env DATABASE_URL=file:/tmp/unused.db --env AEGIFY_TEST_SCANNER_CLI=1 \
            aegify-worker:ci node --test src/lib/scan-jobs.test.ts src/lib/llm-jobs.test.ts src/lib/llm-source-jobs.test.ts src/lib/ai-source-review.test.ts src/lib/provider-receipt.test.ts src/lib/sarif-import.test.ts src/lib/finding-workflow.test.ts src/lib/repo-fetcher.test.ts src/lib/backup.test.ts

      - name: Verify dashboard migration and fail-closed startup
        shell: bash
        run: |
          dashboard_test_volume="aegify-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$dashboard_test_volume" >/dev/null
          container_id=""
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true; docker volume rm "$dashboard_test_volume" >/dev/null 2>&1 || true' EXIT
          container_id="$(docker run --detach \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1001,gid=1001 \
            --mount type=volume,source="$dashboard_test_volume",target=/data \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,uid=1001,gid=1001 \
            --env DATABASE_URL=file:/data/ci.db \
            --env AUTH_SECRET=ci-only-auth-secret-32-characters \
            --env ENCRYPTION_SECRET=ci-only-encryption-secret-32-chars \
            --env AUTH_URL=http://localhost:3000 \
            --env AUTH_ALLOWED_EMAILS=ci-only@example.test \
            --env AUTH_ADMIN_EMAILS=ci-only@example.test \
            --env AUTH_GITHUB_ID=ci-only-client-id \
            --env AUTH_GITHUB_SECRET=ci-only-client-secret \
            aegify-dashboard:ci)"
          wait_dashboard() {
            for attempt in $(seq 1 30); do
              if ! docker inspect --format '{{.State.Running}}' "$container_id" | grep -qx true; then
                docker logs "$container_id"
                exit 1
              fi
              if docker exec "$container_id" node -e \
                'fetch("http://127.0.0.1:3000", {redirect:"manual"}).then(r => process.exit(r.status === 307 ? 0 : 1)).catch(() => process.exit(1))'; then
                break
              fi
              test "$attempt" -lt 30
              sleep 1
            done
          }
          wait_dashboard
          docker exec "$container_id" ./node_modules/.bin/prisma migrate status
          docker exec "$container_id" node --input-type=module -e '
            import { PrismaClient } from "@prisma/client";
            import { PrismaLibSql } from "@prisma/adapter-libsql";
            const db = new PrismaClient({ adapter: new PrismaLibSql({ url: process.env.DATABASE_URL }) });
            await db.project.create({ data: { name: "persistent-ci-fixture" } });
            await db.$disconnect();'
          docker restart "$container_id" >/dev/null
          wait_dashboard
          docker exec "$container_id" node --input-type=module -e '
            import { PrismaClient } from "@prisma/client";
            import { PrismaLibSql } from "@prisma/adapter-libsql";
            const db = new PrismaClient({ adapter: new PrismaLibSql({ url: process.env.DATABASE_URL }) });
            const count = await db.project.count({ where: { name: "persistent-ci-fixture" } });
            await db.$disconnect();
            if (count !== 1) process.exit(1);'
          run_worker_fixture() {
            docker run --rm --init --read-only --network none \
              --cap-drop=ALL --security-opt=no-new-privileges --memory=2g --cpus=2 --pids-limit=128 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1001,gid=1001,size=536870912 \
              --mount type=volume,source="$dashboard_test_volume",target=/data \
              --env DATABASE_URL=file:/data/ci.db \
              --env AUTH_SECRET=ci-only-auth-secret-32-characters \
              --env ENCRYPTION_SECRET=ci-only-encryption-secret-32-chars \
              --env AUTH_ALLOWED_EMAILS=ci-only@example.test \
              --env AUTH_ADMIN_EMAILS=ci-only@example.test \
              aegify-worker:ci "$@"
          }
          run_worker_fixture node scripts/test-worker-container.mjs setup
          run_worker_fixture node scripts/scan-worker.mjs --once
          run_worker_fixture node scripts/test-worker-container.mjs verify
