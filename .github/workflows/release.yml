name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Create the GitHub release and upload its assets.
      id-token: write # Request the short-lived identity used for attestation.
      attestations: write # Publish artifact provenance for the wheel.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify signed annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_type="$(jq -r '.object.type' <<<"$ref_json")"
          tag_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tags must be annotated and cryptographically signed" >&2
            exit 1
          fi
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')"
          if [[ "$verified" != "true" ]]; then
            echo "GitHub did not verify the release tag signature" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Verify lockfile and build wheel
        working-directory: scanner
        run: |
          uv lock --check
          uv build --wheel

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: scanner/dist
          format: cyclonedx-json
          output-file: aegify-sbom.cdx.json
          upload-artifact: false

      - name: Generate release checksums
        run: sha256sum scanner/dist/*.whl aegify-sbom.cdx.json > SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            scanner/dist/*.whl
            aegify-sbom.cdx.json
            SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          scanner/dist/*.whl
          aegify-sbom.cdx.json
          SHA256SUMS
          --verify-tag
          --generate-notes
